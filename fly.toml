# fly.toml app configuration file generated for garmin-strava-mcp on 2026-04-19T22:33:42-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'garmin-strava-mcp'
primary_region = 'ewr'

[build]

[env]
  DATABASE_PATH = '/data/mcp.db'
  HOST = '0.0.0.0'
  PORT = '8000'

[[mounts]]
  source = 'mcp_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
